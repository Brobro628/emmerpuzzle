<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Crossword</title>
<style>
:root{--bg:#eef3f1;--ink:#1f3b33;--cell:#ffffff;--hl:#ffe08a;--good:#2f9e6f;--bad:#d94b63;--muted:#53706a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14201c;--ink:#e4f0ea;--cell:#1e2e28;--hl:#6b5a12;--good:#4cc58f;--bad:#f0728a;--muted:#9bb5ad}}
:root[data-theme="dark"]{--bg:#14201c;--ink:#e4f0ea;--cell:#1e2e28;--hl:#6b5a12;--good:#4cc58f;--bad:#f0728a;--muted:#9bb5ad}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:1rem}
main{max-width:38rem;margin:0 auto}
h1{font-size:1.8rem;margin:.2rem 0 .8rem}
#clue{min-height:3.2rem;padding:.7rem .9rem;border:2px solid var(--ink);border-radius:.75rem;background:var(--cell);font-weight:700;margin-bottom:1rem}
#grid{display:grid;gap:3px;width:100%;margin:0 auto 1rem}
.blank{aspect-ratio:1}
.c{position:relative;aspect-ratio:1;background:var(--cell);border:2px solid var(--ink);border-radius:.3rem}
.c.hl{background:var(--hl)}
.c.done{background:color-mix(in srgb,var(--good) 35%,var(--cell))}
.c.wrong input{color:var(--bad)}
.n{position:absolute;top:1px;left:3px;font-size:.6rem;font-weight:700;color:var(--muted);pointer-events:none}
.c input{width:100%;height:100%;border:0;background:transparent;color:var(--ink);text-align:center;font:inherit;font-weight:700;font-size:1.2rem;text-transform:uppercase;padding:.45rem 0 0;border-radius:.3rem;caret-color:transparent}
.c input:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
.bar{display:flex;gap:.6rem;margin-bottom:.6rem}
button{font:inherit;font-weight:700;padding:.65rem 1.1rem;background:var(--hl);color:var(--ink);border:2px solid var(--ink);border-radius:.75rem;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#msg{min-height:1.6rem;font-weight:700;margin:.2rem 0 1rem}
#msg.ok{color:var(--good)}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:30rem){.lists{grid-template-columns:1fr}}
h2{font-size:1.1rem;margin:0 0 .4rem}
ol{list-style:none;margin:0;padding:0}
li{padding:.4rem .5rem;border-radius:.5rem;cursor:pointer;line-height:1.3}
li.on{background:var(--hl)}
li.done{opacity:.55;text-decoration:line-through}
li b{display:inline-block;min-width:1.6rem}
#jump{margin-bottom:.8rem}
#trivia{margin-top:2.5rem;padding-top:1.5rem;border-top:2px solid var(--ink)}
#trivia h2{font-size:1.5rem;margin:0 0 .6rem}
.tstat{display:flex;justify-content:space-between;font-weight:700;margin-bottom:.8rem}
#tq{font-size:1.15rem;line-height:1.4;margin:0 0 1rem}
#ta{display:grid;gap:.6rem}
#ta button{text-align:left;background:var(--cell)}
#ta button:hover:not(:disabled){background:var(--hl)}
#ta button.correct{background:var(--good);color:var(--bg)}
#ta button.wrong{background:var(--bad);color:var(--bg)}
#tfb{min-height:1.5rem;font-weight:700;margin:.8rem 0 .5rem}
#tnext[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1>Our Crossword</h1>
<button id="jump" type="button">Jump to trivia</button>
<div id="clue" aria-live="polite"></div>
<div id="grid"></div>
<div class="bar"><button id="check">Check</button><button id="clear">Clear</button></div>
<div id="msg" aria-live="polite"></div>
<div class="lists"><div><h2>Across</h2><ol id="la"></ol></div><div><h2>Down</h2><ol id="ld"></ol></div></div>
<section id="trivia"><h2>Trivia</h2><div class="tstat"><span id="tprog"></span><span id="tscore"></span></div><p id="tq"></p><div id="ta"></div><p id="tfb" aria-live="polite"></p><button id="tnext" type="button" hidden>Next question</button></section>
</main>
<script>
const D={"rows": 14, "cols": 10, "words": [{"w": "SHAVASANA", "r": 11, "c": 1, "d": "A", "n": 12, "clue": "Very important pose"}, {"w": "ASANA", "r": 9, "c": 7, "d": "D", "n": 10, "clue": "Derived from a Sanskrit word meaning “seat” or “sitting”"}, {"w": "BOOTS", "r": 7, "c": 1, "d": "D", "n": 6, "clue": "feline"}, {"w": "GAME", "r": 10, "c": 5, "d": "D", "n": 11, "clue": "What you’re playing right now"}, {"w": "JOEY", "r": 8, "c": 0, "d": "A", "n": 8, "clue": "ROO?"}, {"w": "CHUBBY", "r": 3, "c": 3, "d": "D", "n": 3, "clue": "Round and cuddly"}, {"w": "YOGA", "r": 8, "c": 9, "d": "D", "n": 9, "clue": "Practice of stretching, breathing and balance"}, {"w": "BLUEMOON", "r": 5, "c": 1, "d": "A", "n": 5, "clue": "5250 N Palm"}, {"w": "EMMER", "r": 3, "c": 5, "d": "D", "n": 4, "clue": "YOU!"}, {"w": "BORSIN", "r": 7, "c": 3, "d": "A", "n": 7, "clue": "Creamy, high-saturated-fat and sodium snack"}, {"w": "LOVE", "r": 13, "c": 2, "d": "A", "n": 13, "clue": "What I feel toward you"}, {"w": "CHEESE", "r": 3, "c": 3, "d": "A", "n": 3, "clue": "If you Eat to much you will fart"}, {"w": "FRESNO", "r": 0, "c": 7, "d": "D", "n": 1, "clue": "Central California city"}, {"w": "FOSTER", "r": 1, "c": 2, "d": "A", "n": 2, "clue": "A Fat Guy"}]};
const cells={};let active=0,prev=null;
const gridEl=document.getElementById("grid");
gridEl.style.gridTemplateColumns="repeat("+D.cols+", 1fr)";
gridEl.style.maxWidth=(D.cols*3)+"rem";
D.words.forEach((w,i)=>{for(let k=0;k<w.w.length;k++){
  const r=w.r+(w.d==="D"?k:0),c=w.c+(w.d==="A"?k:0),key=r+","+c;
  if(!cells[key])cells[key]={ch:w.w[k],r,c,words:[]};
  cells[key].words.push(i);if(k===0)cells[key].num=w.n;}});
const wordCells=i=>{const w=D.words[i];return w.w.split("").map((_,k)=>cells[(w.r+(w.d==="D"?k:0))+","+(w.c+(w.d==="A"?k:0))]);};
function move(cell){cell.input.focus();prev=cell;}
for(let r=0;r<D.rows;r++)for(let c=0;c<D.cols;c++){
  const cell=cells[r+","+c],div=document.createElement("div");
  if(!cell){div.className="blank";gridEl.appendChild(div);continue;}
  div.className="c";
  if(cell.num){const n=document.createElement("span");n.className="n";n.textContent=cell.num;div.appendChild(n);}
  const inp=document.createElement("input");
  inp.maxLength=2;inp.autocomplete="off";inp.autocapitalize="characters";inp.spellcheck=false;
  inp.setAttribute("aria-label","Row "+(r+1)+", column "+(c+1));
  div.appendChild(inp);gridEl.appendChild(div);cell.el=div;cell.input=inp;
  inp.addEventListener("focus",()=>{if(!cell.words.includes(active)){active=cell.words.find(i=>D.words[i].d==="A")??cell.words[0];}render();});
  inp.addEventListener("click",()=>{if(prev===cell&&cell.words.length>1){active=cell.words.find(i=>i!==active);render();}prev=cell;});
  inp.addEventListener("input",()=>{
    const v=inp.value.toUpperCase().replace(/[^A-Z]/g,"");inp.value=v.slice(-1);
    cell.el.classList.remove("wrong");
    if(inp.value){const wc=wordCells(active),k=wc.indexOf(cell);if(wc[k+1])move(wc[k+1]);}
    checkWin();});
  inp.addEventListener("keydown",e=>{
    if(e.key==="Backspace"&&!inp.value){const wc=wordCells(active),k=wc.indexOf(cell);if(k>0){wc[k-1].input.value="";wc[k-1].el.classList.remove("wrong");move(wc[k-1]);}e.preventDefault();}
    const dm={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];
    if(dm){const n=cells[(cell.r+dm[0])+","+(cell.c+dm[1])];if(n){move(n);e.preventDefault();}}});
}
function render(){
  Object.values(cells).forEach(c=>c.el.classList.remove("hl"));
  wordCells(active).forEach(c=>c.el.classList.add("hl"));
  const w=D.words[active];
  document.getElementById("clue").textContent=w.n+" "+(w.d==="A"?"Across":"Down")+": "+w.clue+" ("+w.w.length+")";
  document.querySelectorAll("li").forEach(li=>li.classList.toggle("on",+li.dataset.i===active));
}
D.words.map((w,i)=>[w,i]).sort((a,b)=>a[0].n-b[0].n).forEach(([w,i])=>{
  const li=document.createElement("li");li.dataset.i=i;
  li.innerHTML="<b></b><span></span>";li.firstChild.textContent=w.n+".";li.lastChild.textContent=w.clue+" ("+w.w.length+")";
  li.addEventListener("click",()=>{active=i;move(wordCells(i)[0]);render();});
  document.getElementById(w.d==="A"?"la":"ld").appendChild(li);});
const msg=document.getElementById("msg");
function markDone(){
  const ok=D.words.map((w,i)=>wordCells(i).every(c=>c.input.value===c.ch));
  Object.values(cells).forEach(c=>c.el.classList.toggle("done",c.words.some(i=>ok[i])));
  document.querySelectorAll("li").forEach(li=>li.classList.toggle("done",ok[+li.dataset.i]));}
function checkWin(){markDone();const all=Object.values(cells);
  if(all.every(c=>c.input.value===c.ch)){msg.textContent="YAY, You are smart!";msg.className="ok";}
  else if(msg.className==="ok"){msg.textContent="";msg.className="";}}
document.getElementById("check").addEventListener("click",()=>{
  let bad=0;Object.values(cells).forEach(c=>{const w=c.input.value&&c.input.value!==c.ch;c.el.classList.toggle("wrong",!!w);if(w)bad++;});
  if(!bad&&msg.className!=="ok"){msg.textContent="No wrong letters so far.";}
  else if(bad){msg.textContent=bad+" wrong "+(bad===1?"letter is":"letters are")+" marked in red.";msg.className="";}
  checkWin();});
document.getElementById("clear").addEventListener("click",()=>{
  Object.values(cells).forEach(c=>{c.input.value="";c.el.classList.remove("wrong");});msg.textContent="";msg.className="";markDone();});
const TQ=[
 {q:"What is the capital of India?",c:["Mumbai","New Delhi","Kolkata","Bengaluru"],a:1},
 {q:"What is the best rated restaurant in Fresno?",c:["Yosemite Ranch","Pismo's","Heirloom","FocacciaFresno"],a:2},
 {q:"Which dog can run up to 32 mph and has a bite force around 238 to 291+ psi?",c:["Labrador Retriever","Chihuahua","German Shepherd","Poodle"],a:2},
 {q:"About how many people practice yoga worldwide?",c:["300 million","30 million","100 million","1 billion"],a:0},
 {q:"What is the 5th closest planet to the Sun?",c:["Mars","Jupiter","Saturn","Uranus"],a:1},
 {q:"What is Shavasana also known as?",c:["Cobra pose","Tree pose","Child’s pose","Corpse pose"],a:3},
 // Dinosaurs (medium)
 {q:"Which dinosaur had large bony back plates and a spiked tail, and lived in the Late Jurassic?",c:["Triceratops","Stegosaurus","Velociraptor","Spinosaurus"],a:1},
 {q:"Which of these dinosaurs lived closer in time to us today than to Stegosaurus?",c:["Tyrannosaurus rex","Brachiosaurus","Allosaurus","Diplodocus"],a:0},
 {q:"What does the name “Triceratops” mean?",c:["Three-horned face","Terrible lizard","Swift thief","Armored shield"],a:0},
 {q:"Real Velociraptors were about the size of a:",c:["Horse","Turkey","Elephant","Grizzly bear"],a:1},
 // Engineering (medium to hard)
 {q:"Which material property describes how much a material can stretch or deform under tension before it breaks?",c:["Hardness","Ductility","Brittleness","Density"],a:1},
 {q:"The individual members of an ideal truss mainly carry which kind of load?",c:["Bending only","Torsion","Axial tension and compression","Shear only"],a:2},
 {q:"On a stress-strain curve, which point marks where a material starts to deform permanently?",c:["Ultimate strength","Yield point","Fracture point","Elastic modulus"],a:1},
 {q:"The 1940 collapse of the Tacoma Narrows Bridge is mainly blamed on:",c:["An earthquake","Aeroelastic flutter","Corroded cables","Too much traffic"],a:1},
 // Electricity (hard)
 {q:"A 12 V battery pushes 3 A through a resistor. How much power does the resistor dissipate?",c:["4 W","15 W","36 W","144 W"],a:2},
 {q:"Three 6 Ω resistors are connected in parallel. What is the equivalent resistance?",c:["18 Ω","6 Ω","3 Ω","2 Ω"],a:3},
 {q:"What is the time constant of a series RC circuit?",c:["R ÷ C","R × C","R + C","1 ÷ (R × C)"],a:1},
 {q:"Which law says the total current flowing into a node equals the total current flowing out?",c:["Ohm’s law","Kirchhoff’s current law","Faraday’s law","Lenz’s law"],a:1},
 {q:"A sine-wave AC voltage has a peak of about 170 V. What is its approximate RMS value?",c:["85 V","120 V","170 V","240 V"],a:1}
];
let ti=0,ts=0;
const tqEl=document.getElementById("tq"),taEl=document.getElementById("ta"),tfb=document.getElementById("tfb"),tnext=document.getElementById("tnext"),tprog=document.getElementById("tprog"),tscore=document.getElementById("tscore");
function tShow(){const it=TQ[ti];tprog.textContent="Question "+(ti+1)+" of "+TQ.length;tscore.textContent="Score: "+ts;tqEl.textContent=it.q;tfb.textContent="";tnext.hidden=true;taEl.innerHTML="";
 it.c.forEach((t,i)=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.addEventListener("click",()=>tPick(i));taEl.appendChild(b);});}
function tPick(i){const it=TQ[ti],bs=taEl.querySelectorAll("button");bs.forEach(b=>b.disabled=true);bs[it.a].classList.add("correct");
 if(i===it.a){ts++;tfb.textContent="Correct!";}else{bs[i].classList.add("wrong");tfb.textContent="Not quite.";}
 tscore.textContent="Score: "+ts;tnext.textContent=ti===TQ.length-1?"See results":"Next question";tnext.hidden=false;}
tnext.addEventListener("click",()=>{
 if(ti>=TQ.length){ti=0;ts=0;tShow();}
 else if(ti===TQ.length-1){tprog.textContent="All done";tqEl.textContent="You got "+ts+" out of "+TQ.length+".";taEl.innerHTML="";tfb.textContent="";tnext.textContent="Play again";ti=TQ.length;}
 else{ti++;tShow();}});
document.getElementById("jump").addEventListener("click",()=>document.getElementById("trivia").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}));
tShow();
render();
</script>
</body>
</html>
